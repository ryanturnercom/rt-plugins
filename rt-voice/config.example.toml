# rt-voice configuration
# Copy this file to .claude/rt-voice.toml in your project

# Enable or disable all sounds
enabled = true

# Theme name (folder name in themes/)
theme = "default"

# Master volume (0.0 to 1.0)
volume = 0.8

# Minimum seconds between two plays of the same event. Playback is async, so
# without this a burst of parallel tool calls would stack overlapping copies of
# the same clip. Set to 0 to play every single fire.
cooldown = 1.5
